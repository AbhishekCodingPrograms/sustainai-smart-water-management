name: Python compatibility tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install binary packages
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Run pipeline and Streamlit tests
        run: python -m pytest -q
      - name: Reproduce synthetic evaluation
        run: python evaluate.py
